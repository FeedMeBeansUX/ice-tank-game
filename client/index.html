<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ice Tank Sumo</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="hud-title">Ice Tank Sumo <span class="hud-tag">milestone 2 · practice</span></div>
      <div class="hud-help">
        <span><kbd>Click</kbd> turn and push</span>
        <span><kbd>Shift</kbd> ability</span>
        <span><kbd>F</kbd> firing on/off</span>
      </div>
      <div class="hud-help">
        <span><kbd>P</kbd> practice setup</span>
        <span><kbd>T</kbd> tuning</span>
        <span><kbd>C</kbd> overview</span>
      </div>
      <div class="hud-stats" id="hud-stats"></div>
      <div class="hud-cam" id="hud-cam"></div>
    </div>
    <div id="banner" hidden></div>
    <div id="weapon"></div>
    <div id="build"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
